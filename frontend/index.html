<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>data-agent 数据分析助手</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --text:#e6e9ef; --muted:#8b93a3; --accent:#4da3ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .status { margin-left: auto; font-size: 12px; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 72%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .progress { color: var(--muted); font-size: 13px; align-self: flex-start; }
  .chart-img { max-width: 100%; border-radius: 8px; display: block; background: #fff; padding: 8px; }
  /* Agent 步骤卡片：展示工具调用（名字/参数/结果），让用户看到"它在做什么" */
  .tool { align-self: flex-start; max-width: 72%; background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 14px; font-size: 13px; }
  .tool.tool-err { border-left-color: #e8463a; }
  .tool .tname { color: var(--accent); font-weight: 600; font-family: Consolas, monospace; }
  .tool .targs { color: var(--muted); font-family: Consolas, monospace; margin-top: 4px; word-break: break-all; }
  .tool .tres { color: var(--text); margin-top: 6px; white-space: pre-wrap; opacity: .8; }
  footer { padding: 16px 24px; border-top: 1px solid var(--line); display: flex; gap: 12px; }
  textarea { flex: 1; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-size: 14px; resize: none; height: 52px; font-family: inherit; }
  textarea:focus { outline: 1px solid var(--accent); }
  button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 0 20px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #fileBtn { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  input[type=file] { display: none; }
  /* 审批卡片（HITL）：高危 SQL 执行前的人工确认 */
  .approval { align-self: flex-start; max-width: 72%; background: #1d1a12; border: 1px solid #4a3a12; border-left: 3px solid #e0a52a; border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  .approval .a-title { color: #e0a52a; font-weight: 600; margin-bottom: 6px; }
  .approval .a-hint { color: var(--muted); margin-bottom: 8px; }
  .approval .a-sql { background: #0b0d11; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: #cfe3ff; font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; overflow-x: auto; }
  .approval .a-reasons { margin: 8px 0 0 18px; color: #f0c674; }
  .approval .a-reasons li { margin: 2px 0; }
  .approval .a-note { width: 100%; margin-top: 10px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; }
  .approval .a-btns { display: flex; gap: 8px; margin-top: 10px; }
  .approval .a-btns button { padding: 4px 12px; font-size: 12px; }
  .approval .a-btns .danger { background: transparent; border: 1px solid #6b3a34; color: #e8837a; }
</style>
</head>
<body>
<header>
  <h1>data-agent</h1>
  <div class="status" id="status">空闲</div>
</header>
<div id="chat"></div>
<footer>
  <button id="fileBtn">上传数据</button>
  <button id="dbBtn">连接数据库</button>
  <input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.json,.parquet">
  <textarea id="input" placeholder="输入你的问题，例如：各商品销售额排行"></textarea>
  <button id="sendBtn">发送</button>
</footer>

<script>
// SSE 消费端：fetch + getReader + TextDecoder(stream:true) 手写解析。
// 不用浏览器原生 EventSource 的原因：EventSource 只支持 GET、
// 不能带请求体，也无法自定义 headers —— 而聊天接口必须 POST。
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');
const fileInput = document.getElementById('fileInput');
document.getElementById('fileBtn').onclick = () => fileInput.click();

// session_id 存 localStorage：刷新页面后仍是同一会话（后端内存里没有
// 的话会重开，这里补一个"透明重开"：后端永远以请求自带 history 为准）
const sessionId = localStorage.getItem('da_session') || crypto.randomUUID();
localStorage.setItem('da_session', sessionId);

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

// 打字机：把 text 逐字写入 el，像 AI 那样"流"出来而不是整段闪现。
// 按时长打字而不是按固定帧数：短句约 0.5s、长文本最多 1.6s。
function typeInto(el, text, done) {
  el.textContent = '';
  if (!text) { if (done) done(); return; }
  const totalMs = Math.min(1600, Math.max(400, text.length * 35));
  const start = performance.now();
  const timer = setInterval(() => {
    const p = Math.min(1, (performance.now() - start) / totalMs);
    el.textContent = text.slice(0, Math.ceil(text.length * p));
    chat.scrollTop = chat.scrollHeight;
    if (p >= 1) { clearInterval(timer); if (done) done(); }
  }, 16);
}

function addProgress(text) {
  const div = document.createElement('div');
  div.className = 'progress';
  chat.appendChild(div);
  typeInto(div, '⏳ ' + text);   // 真实内容逐字写出
  return div;
}

// Agent 步骤卡片：工具名 + 调用参数 + 结果摘要。
function addToolCard(ev) {
  const div = document.createElement('div');
  div.className = 'tool' + (ev.ok ? '' : ' tool-err');
  const name = document.createElement('div');
  name.className = 'tname';
  const args = document.createElement('div');
  args.className = 'targs';
  const res = document.createElement('div');
  res.className = 'tres';
  div.appendChild(name);
  div.appendChild(args);
  div.appendChild(res);
  chat.appendChild(div);
  typeInto(name, ev.name, () => {
    typeInto(args, '参数: ' + (ev.arguments || '{}'), () => {
      typeInto(res, '→ ' + (ev.result || ''));
    });
  });
}

// 审批卡片（HITL）：高危 SQL 在执行前展示给用户。
// 三件事必须说清楚：将执行什么 SQL、为什么拦、不确认会怎样。
function addApprovalCard(evt) {
  const wrap = document.createElement('div');
  wrap.className = 'approval';

  const title = document.createElement('div');
  title.className = 'a-title';
  title.textContent = '⚠ 执行前需要你确认';
  wrap.appendChild(title);

  if (evt.summary) {
    const hint = document.createElement('div');
    hint.className = 'a-hint';
    hint.textContent = evt.summary;
    wrap.appendChild(hint);
  }

  (evt.queries || []).forEach((q) => {
    const sql = document.createElement('pre');
    sql.className = 'a-sql';
    sql.textContent = q.sql;           // textContent：SQL 里可能有 < > 等字符
    wrap.appendChild(sql);
    const ul = document.createElement('ul');
    ul.className = 'a-reasons';
    (q.reasons || []).forEach((r) => {
      const li = document.createElement('li');
      li.textContent = r;
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
  });

  const note = document.createElement('input');
  note.className = 'a-note';
  note.placeholder = '拒绝原因（可选，会告诉 Agent 怎么改）';
  wrap.appendChild(note);

  const row = document.createElement('div');
  row.className = 'a-btns';
  const ok = document.createElement('button');
  ok.textContent = '批准执行';
  const no = document.createElement('button');
  no.textContent = '拒绝';
  no.className = 'danger';
  row.appendChild(ok);
  row.appendChild(no);
  wrap.appendChild(row);

  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;

  const disable = () => { ok.disabled = true; no.disabled = true; };
  ok.onclick = () => { disable(); decide(evt.thread_id, 'approve', ''); };
  no.onclick = () => { disable(); decide(evt.thread_id, 'reject', note.value.trim()); };
}

// 审批结果回到同一条 SSE 通道：确认只是让对话继续，不是另一个页面。
async function decide(threadId, decision, note) {
  statusEl.textContent = decision === 'approve' ? '执行中' : '处理中';
  try {
    const res = await fetch('/api/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ thread_id: threadId, decision, note }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      addMessage('assistant', '确认失败: ' + (data.detail || res.status));
      statusEl.textContent = '空闲';
      return;
    }
    await consume(res);
    statusEl.textContent = '空闲';
  } catch (err) {
    addMessage('assistant', '确认失败: ' + err.message);
    statusEl.textContent = '空闲';
  }
}

// 手写 SSE 解析：read() 返回的 chunk 可能把一行切成两半，
// 必须用 stream:true 保留不完整字节 + 手动按 \n\n 切帧。
// chat 与 approve 共用（两者的事件协议完全一致）。
async function consume(res) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buf = '';
  const seen = { answered: false, approval: false };
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const frame = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      if (!frame.startsWith('data: ')) continue;
      const evt = JSON.parse(frame.slice(6));
      if (evt.type === 'node') {
        if (evt.message) addProgress(evt.message);
      } else if (evt.type === 'tool_call') {
        addToolCard(evt);
      } else if (evt.type === 'chart') {
        const div = document.createElement('div');
        div.className = 'msg assistant';
        const img = document.createElement('img');
        img.src = evt.image;
        img.className = 'chart-img';
        div.appendChild(img);
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      } else if (evt.type === 'approval_required') {
        seen.approval = true;
        addApprovalCard(evt);
      } else if (evt.type === 'answer') {
        seen.answered = true;
        addMessage('assistant', evt.text);
      }
    }
  }
  if (!seen.answered && !seen.approval) addMessage('assistant', '（无回答）');
  return seen;
}

// 断线重连：网络中断（fetch 失败/读流失败）自动重发同一请求，
// 退避 1s/2s/3s，最多 3 次；重发带 retry 标记让后端幂等去重。
// 服务端错误（HTTP 4xx/5xx）不重试——那是业务错误，重发无意义。
const MAX_RETRY = 3;
let retryCount = 0;

class ServerError extends Error {}

async function send() {
  const message = input.value.trim();
  if (!message) return;
  addMessage('user', message);  // 用户消息只渲染一次，重连不重复
  input.value = '';
  sendBtn.disabled = true;
  statusEl.textContent = '处理中';
  retryCount = 0;
  await sendOnce(message);
  sendBtn.disabled = false;
}

async function sendOnce(message) {
  const baseCount = chat.children.length;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message, retry: retryCount > 0 }),
    });
    if (!res.ok) throw new ServerError('服务端错误 HTTP ' + res.status);
    await consume(res);
    statusEl.textContent = '空闲';
  } catch (err) {
    if (!(err instanceof ServerError) && retryCount < MAX_RETRY) {
      retryCount += 1;
      statusEl.textContent = `连接中断，正在重连（${retryCount}/${MAX_RETRY}）…`;
      await new Promise(r => setTimeout(r, retryCount * 1000));
      while (chat.children.length > baseCount) chat.removeChild(chat.lastChild);
      return sendOnce(message);
    }
    addMessage('assistant', err instanceof ServerError
      ? err.message
      : '请求失败（已重连 ' + MAX_RETRY + ' 次仍失败）: ' + err.message);
    statusEl.textContent = '空闲';
  }
}

sendBtn.onclick = send;
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

fileInput.onchange = async () => {
  const file = fileInput.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: form });
    const data = await res.json();
    addMessage('assistant', res.ok
      ? '已加载表: ' + data.tables.join(', ')
      : '上传失败: ' + (data.detail || res.status));
  } catch (err) {
    addMessage('assistant', '上传失败: ' + err.message);
  } finally {
    fileInput.value = '';
  }
};

// 连接远端 MySQL：连接串含密码，用 prompt 当场输入、不做任何存储。
document.getElementById('dbBtn').onclick = async () => {
  const url = prompt(
    'MySQL 连接串（请把 PASSWORD 替换成真实密码）:',
    'mysql+pymysql://root:PASSWORD@127.0.0.1:3306/stdw'
  );
  if (!url) return;
  statusEl.textContent = '连接中';
  addMessage('assistant', '正在连接远端库…');
  try {
    const res = await fetch('/api/connect_mysql', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!res.ok) {
      addMessage('assistant', '连接失败: ' + (data.detail || res.status));
    } else {
      addMessage('assistant',
        '连接成功。本地已搬运 ' + data.moved.length + ' 张表，'
        + '远端保留 ' + data.large.length + ' 张大表。\n当前可用表: '
        + data.tables.join(', '));
    }
  } catch (err) {
    addMessage('assistant', '连接失败: ' + err.message);
  } finally {
    statusEl.textContent = '空闲';
  }
};
</script>
</body>
</html>
